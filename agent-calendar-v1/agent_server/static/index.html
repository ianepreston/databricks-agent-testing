<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Calendar Assistant</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/app.js" defer></script>
  </head>
  <body>
    <h1>Calendar Assistant</h1>
    <p>Ask about today or your Google Calendar.</p>
    <div id="chat"></div>
    <form id="form">
      <input id="message" autofocus placeholder="What is on my calendar today?">
      <button>Send</button>
    </form>
  </body>
</html>
